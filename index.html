<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SyncCraft</title>
    <!-- Runs before the first paint so a dark-theme user never sees a light flash.
         It reads the saved theme straight from localStorage and sets data-theme on <html>.
         React takes over once it loads (see src/app/theme.ts). -->
    <script>
      (function () {
        try {
          var theme = 'system'
          var raw = localStorage.getItem('synccraft-progress')
          if (raw) {
            var saved = JSON.parse(raw).state
            if (saved && saved.settings && saved.settings.theme) theme = saved.settings.theme
          }
          var dark =
            theme === 'dark' ||
            (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
